<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jurnal Mingguan Anggota Guru Wali</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      overflow: hidden;
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    /* Container Loading Overlay */
    #loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100dvh;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    /* Animasi Spinner CSS */
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #e5e7eb;
      border-top: 4px solid #2563eb; /* Warna utama spinner */
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .loader-text {
      margin-top: 16px;
      font-size: 14px;
      color: #4b5563;
      font-weight: 500;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Class untuk menyembunyikan loader dengan efek fade-out */
    .hidden {
      opacity: 0;
      visibility: hidden;
    }

    iframe {
      width: 100%;
      height: 100dvh;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <div id="loader">
    <div class="spinner"></div>
    <p class="loader-text">Memuat aplikasi...</p>
  </div>

  <iframe 
    src="https://script.google.com/macros/s/AKfycbzBIsm9MynQfx7XkkS2s6KjL1aTCpBSknWX4PWQohSGQVUFH0fhx9AupIYiXzIrAXtvpQ/exec" 
    onload="hideLoader()"
    allow="geolocation; microphone; camera; clipboard-write; autoplay;" 
    allowfullscreen>
  </iframe>

  <script>
    function hideLoader() {
      const loader = document.getElementById('loader');
      if (loader) {
        loader.classList.add('hidden');
        // Hapus element dari DOM setelah animasi fade-out selesai
        setTimeout(() => {
          loader.style.display = 'none';
        }, 400);
      }
    }
  </script>

</body>
</html>
